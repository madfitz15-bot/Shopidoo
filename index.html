<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopiDoo - Coming Soon</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    text-align: center;
}

/* Center Container */
.container {
    padding: 40px 20px;
}

/* Title */
h1 {
    font-size: 3rem;
}

/* Countdown */
.countdown {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 30px 0;
}

.box {
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 10px;
    min-width: 70px;
}

.box span {
    font-size: 1.8rem;
    font-weight: bold;
    color: #ffd700;
}

/* Form */
.form-container {
    margin-top: 30px;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
}

iframe {
    width: 100%;
    height: 500px;
    border: none;
    border-radius: 10px;
}

/* Footer */
.footer {
    margin-top: 40px;
    opacity: 0.8;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🛍️ ShopiDoo</h1>
    <p>Smarter Way to Shop Online</p>

    <h3>Launching Soon 🚀</h3>

    <!-- Countdown -->
    <div class="countdown">
        <div class="box"><span id="days">0</span><br>Days</div>
        <div class="box"><span id="hours">0</span><br>Hours</div>
        <div class="box"><span id="minutes">0</span><br>Minutes</div>
        <div class="box"><span id="seconds">0</span><br>Seconds</div>
    </div>

    <!-- Google Form -->
    <div class="form-container">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdw1xrUy9HEThmhEr2DeDwFXidaxay575QI94pFINxOGs5rUg/viewform?embedded=true">
            Loading…
        </iframe>
    </div>

    <div class="footer">
        © 2026 ShopiDoo | All rights reserved
    </div>

</div>

<script>
// 30 days countdown
const targetDate = new Date();
targetDate.setDate(targetDate.getDate() + 30);

function updateCountdown() {
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) return;

    document.getElementById('days').innerText = Math.floor(diff / (1000*60*60*24));
    document.getElementById('hours').innerText = Math.floor((diff % (1000*60*60*24))/(1000*60*60));
    document.getElementById('minutes').innerText = Math.floor((diff % (1000*60*60))/(1000*60));
    document.getElementById('seconds').innerText = Math.floor((diff % (1000*60))/1000);
}

setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
